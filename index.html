<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence Arcade</title>
<meta name="description" content="Arcade-style study games for the Federal Rules of Evidence, powered by OpenRouter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<style>
/* Retro arcade cabinet in a courtroom: pixel frames with notched corners, chunky 3D buttons,
   a lit marquee header. Reading text stays dark ink on cream paper in a clean sans font;
   the pixel font is only for short labels. Variables are redefined on paper surfaces. */
:root{
  --text:#fbf3e2; --muted:#ead9bc; --line:#8a5a36;
  --cyan:#a9d8ff; --pink:#ffb8c4; --yellow:#f6cd57; --green:#86e6ae; --red:#ff9a90; --orange:#ffc27a;
  --paper:#fbf6e9; --paper2:#f3ead3; --field:#fffdf6; --edge:#8a7350;
  --brass:#d9a83a; --navy:#1f4e8c; --ox:#9b1c2c; --wood-dark:#2b190e; --frame:#1a0f07;
  --pixel:"Press Start 2P", ui-monospace, monospace;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.card,.tile,.stat,.weak-btn,.modal,.notice{
  --text:#2a1d13; --muted:#5f4c39; --line:#d6c39a;
  --cyan:#1f4e8c; --pink:#9b1c2c; --yellow:#7d5a0c; --green:#1b7a43; --red:#b3261e; --orange:#9a5300;
  color:var(--text)}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.55}
body{min-height:100vh;display:flex;flex-direction:column;background-color:#6b4226;
  /* 8-bit wood paneling: hard-edged planks and seams, no smooth gradients */
  background-image:
    linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.2)),
    repeating-linear-gradient(90deg,#3a2213 0 4px,transparent 4px 132px),
    repeating-linear-gradient(0deg,#6e4428 0 6px,#674025 6px 12px,#6e4428 12px 20px,#623c22 20px 24px);
  background-attachment:fixed}
a{color:var(--cyan);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.6}
:focus-visible{outline:3px dashed var(--yellow);outline-offset:4px}
.sprite{display:inline-block;vertical-align:middle;image-rendering:pixelated}

/* ---------- marquee header / footer ---------- */
header.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px 20px;background:#120a05;border-bottom:4px solid var(--brass);box-shadow:0 4px 0 #000}
header.top::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:4px;height:8px;pointer-events:none;
  background:radial-gradient(circle at 4px 4px,#fff2c4 0 1.5px,#e0a92e 2px 3px,transparent 3.5px) 0 0/16px 8px repeat-x;
  animation:bulbs .9s steps(2) infinite}
@keyframes bulbs{to{background-position:8px 0}}
.logo{position:relative;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-family:var(--pixel);font-size:14px;
  color:#f6cd57;text-shadow:0 0 8px rgba(246,205,87,.55),2px 2px 0 #000;letter-spacing:1px;text-align:left}
.logo .arc{color:#fbf3e2}
#logoIco{display:inline-flex}
.hud-top{position:relative;display:flex;align-items:center;gap:8px}
.coins{font-family:var(--pixel);font-size:11px;color:#fbf3e2;white-space:nowrap;margin-right:6px;letter-spacing:1px}
.coins .oneup{color:#ff5a4f;animation:blink 1.2s steps(2,start) infinite;margin-right:6px}
.icon-btn{background:#2b190e;border:0;width:40px;height:40px;font-size:17px;line-height:1;color:#fbf3e2;margin:3px;
  box-shadow:0 -3px 0 0 var(--brass),0 3px 0 0 var(--brass),-3px 0 0 0 var(--brass),3px 0 0 0 var(--brass)}
.icon-btn:hover{background:#4a2d19}
main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:26px 16px 48px}
footer{padding:16px;text-align:center;color:#ead9bc;font-size:14px;background:#120a05;border-top:4px solid var(--brass)}

/* ---------- pixel frames (notched corners + double inner line + hard drop shadow) ---------- */
.card,.tile,.stat,.weak-btn,.modal{border:0;border-radius:0;background:var(--paper);
  box-shadow:0 -4px 0 0 var(--frame),0 4px 0 0 var(--frame),-4px 0 0 0 var(--frame),4px 0 0 0 var(--frame),
    inset 0 0 0 3px var(--paper),inset 0 0 0 6px var(--brass),8px 10px 0 0 rgba(0,0,0,.3)}
.card{padding:22px;margin:4px 4px 30px}
/* first heading in a card becomes a title bar, like a game dialog box */
.card > .h2:first-child{margin:-16px -16px 16px;padding:12px 16px;background:var(--ox);color:#fff8e7;line-height:1.7}
.card > .h2:first-child .step{background:#f6cd57;color:#2a1d13}

/* ---------- type ---------- */
.h1{font-family:var(--pixel);font-size:clamp(18px,4.6vw,30px);line-height:1.45;margin:8px 0 18px;color:#f6cd57;
  text-shadow:3px 3px 0 #b5651d,6px 6px 0 var(--wood-dark)}
.card .h1{text-shadow:2px 2px 0 rgba(0,0,0,.15)}
.title-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.h2{font-family:var(--pixel);font-size:12px;line-height:1.7;margin:0 0 12px;color:var(--pink)}
.step{display:inline-block;font-family:var(--pixel);font-size:10px;color:#fff8e7;background:var(--ox);padding:4px 7px;margin-right:10px;vertical-align:1px}
.muted{color:var(--muted)} .small{font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.pixel{font-family:var(--pixel)}
.blink{animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}

/* ---------- chunky arcade buttons ---------- */
.btn{--c:var(--navy);--cd:#12305a;--bg:var(--field);
  font-family:var(--pixel);font-size:11px;line-height:1.5;letter-spacing:.5px;text-transform:uppercase;
  color:var(--c);background:var(--bg);border:0;border-radius:0;padding:12px 16px;min-height:44px;margin:3px 3px 7px;
  box-shadow:0 -3px 0 0 var(--c),0 3px 0 0 var(--c),-3px 0 0 0 var(--c),3px 0 0 0 var(--c),0 7px 0 0 var(--cd);
  transition:transform .05s}
.btn:hover:not(:disabled){background:#eaf1fb}
.btn:active:not(:disabled){transform:translateY(3px);
  box-shadow:0 -3px 0 0 var(--c),0 3px 0 0 var(--c),-3px 0 0 0 var(--c),3px 0 0 0 var(--c),0 4px 0 0 var(--cd)}
.btn.pink{--c:var(--ox);--cd:#5a0e19} .btn.pink:hover:not(:disabled){background:#fbecee}
.btn.yellow{--c:#7d5a0c;--cd:#4a3506;--bg:#f3c74b;color:#2a1d13} .btn.yellow:hover:not(:disabled){background:#f7d46c}
.btn.ghost{--c:#8a7350;--cd:#5a4a32;--bg:var(--paper2);color:#4a3a2a} .btn.ghost:hover:not(:disabled){background:#efe3c6}
.btn.solid{--c:#5a0e19;--cd:#3a0810;--bg:var(--ox);color:#fff8e7;font-size:12px} .btn.solid:hover:not(:disabled){background:#b02234}
.btn.small{font-size:10px;min-height:36px;padding:8px 12px}

/* ---------- title screen ---------- */
.hero{text-align:center;margin-bottom:26px}
.hero .sprite{filter:drop-shadow(4px 4px 0 rgba(0,0,0,.4))}
.subtitle{font-size:11px;color:#fbf3e2;letter-spacing:2px;margin-bottom:12px}
.lede{max-width:580px;margin:0 auto;font-size:17px;color:#fbf3e2}
.press{text-align:center;font-family:var(--pixel);font-size:12px;color:#fbf3e2;margin:26px 0 4px;letter-spacing:2px}
.coin-btn{display:block;width:calc(100% - 8px);margin:14px 4px 18px;padding:22px;font-family:var(--pixel);font-size:clamp(14px,4vw,20px);
  color:#2a1d13;background:#f3c74b;border:0;border-radius:0;
  box-shadow:0 -4px 0 0 #4a3506,0 4px 0 0 #4a3506,-4px 0 0 0 #4a3506,4px 0 0 0 #4a3506,inset 0 -6px 0 0 #d9a83a,0 10px 0 0 #2b190e}
.coin-btn:hover{background:#f7d46c}
.coin-btn:active{transform:translateY(5px);box-shadow:0 -4px 0 0 #4a3506,0 4px 0 0 #4a3506,-4px 0 0 0 #4a3506,4px 0 0 0 #4a3506,inset 0 -6px 0 0 #d9a83a,0 5px 0 0 #2b190e}

/* ---------- forms ---------- */
input[type=text],input[type=password],select,textarea{width:100%;background:var(--field);border:3px solid var(--edge);border-radius:0;color:#2a1d13;
  padding:11px 12px;font:inherit;font-size:16px}
textarea{resize:vertical;min-height:180px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy);box-shadow:4px 4px 0 0 rgba(31,78,140,.3)}
label.lbl{display:block;font-weight:700;margin:12px 0 6px}
details.adv summary{cursor:pointer;font-weight:700;color:var(--muted);padding:4px 0}
.tabs{display:flex;gap:10px;margin-bottom:14px}
.tab{flex:1;background:var(--paper2);border:3px solid var(--edge);border-radius:0;padding:10px;font-family:var(--pixel);font-size:10px;color:var(--muted);text-transform:uppercase}
.tab.on{border-color:var(--navy);color:#fff;background:var(--navy)}
.drop{display:block;border:3px dashed var(--edge);padding:28px 16px;text-align:center;cursor:pointer;color:var(--muted);background:var(--field)}
.drop.over{border-color:var(--navy);color:var(--navy)}
.drop input{display:none}
.status{font-size:15px;margin-top:8px;min-height:1.2em}
.status.ok{color:var(--green);font-weight:700} .status.err{color:var(--red);font-weight:700}
.notice{border:3px solid #c98a1a;background:#fff4dc;padding:12px 14px;margin:0 0 18px;font-size:15px}

/* ---------- hub ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px;margin:4px 4px 30px}
.tile{position:relative;text-align:left;padding:20px;min-height:180px;display:flex;flex-direction:column;gap:8px;transition:transform .06s}
.tile:hover{transform:translate(-2px,-2px)}
.tile:active{transform:translate(3px,3px)}
.tile .tname{font-family:var(--pixel);font-size:13px;color:var(--pink);line-height:1.6}
.tile .tdesc{font-size:15px;color:var(--muted);flex:1}
.tile .thi{font-family:var(--pixel);font-size:10px;color:var(--cyan);line-height:1.8}
.tile .go{font-family:var(--pixel);font-size:10px;color:var(--pink)}
.weak-btn{width:calc(100% - 8px);text-align:left;display:flex;gap:16px;align-items:center;background:#fbe9ec;padding:18px 20px;margin:4px 4px 30px}
.weak-btn:hover{transform:translate(-2px,-2px)}
.mbar{display:grid;grid-template-columns:minmax(120px,220px) 1fr 52px;gap:12px;align-items:center;margin:10px 0;font-size:15px}
.mbar .track{height:20px;background:#2b190e;padding:3px}
.mbar .fill{height:100%;background:repeating-linear-gradient(90deg,#2fbf6b 0 10px,transparent 10px 13px);transition:width .6s steps(8)}
.mbar.weak .fill{background:repeating-linear-gradient(90deg,#e5484d 0 10px,transparent 10px 13px)}
.mbar .pct{font-family:var(--pixel);font-size:10px;text-align:right}
.tag{display:inline-block;font-family:var(--pixel);font-size:8px;padding:3px 5px;background:#b3261e;color:#fff;margin-left:6px;vertical-align:2px}

/* ---------- loading ---------- */
.loading{text-align:center;padding:24px 0}
.bob{animation:bob .7s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.loadbar{height:28px;background:#120a05;padding:4px;margin:24px auto;max-width:420px;overflow:hidden;
  box-shadow:0 -4px 0 0 #f6cd57,0 4px 0 0 #f6cd57,-4px 0 0 0 #f6cd57,4px 0 0 0 #f6cd57}
.loadbar div{height:100%;width:30%;background:repeating-linear-gradient(90deg,#f6cd57 0 12px,transparent 12px 16px);animation:load 1.6s steps(20) infinite}
@keyframes load{0%{margin-left:-30%}100%{margin-left:100%}}
.tip{max-width:560px;margin:22px auto;text-align:left}
.prog{font-weight:700;margin:0 0 6px;min-height:1.5em}

/* ---------- in-game ---------- */
.ghud{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-family:var(--pixel);font-size:10px;margin:4px 4px 20px;color:#fbf3e2;
  background:#120a05;padding:12px 14px;
  box-shadow:0 -4px 0 0 var(--brass),0 4px 0 0 var(--brass),-4px 0 0 0 var(--brass),4px 0 0 0 var(--brass),6px 8px 0 0 rgba(0,0,0,.3)}
.ghud .gt{color:#f6cd57}
.ghud .sc{color:#a9d8ff;letter-spacing:1px}
.ghud .streak{color:#ffc27a}
.ghud .lives{display:inline-flex;gap:4px}
.timer{height:18px;background:#120a05;padding:3px;margin:0 4px 22px;
  box-shadow:0 -3px 0 0 var(--brass),0 3px 0 0 var(--brass),-3px 0 0 0 var(--brass),3px 0 0 0 var(--brass)}
.timer div{height:100%;background:repeating-linear-gradient(90deg,#3ddc84 0 10px,transparent 10px 13px);transition:width .1s linear}
.timer.warn div{background:repeating-linear-gradient(90deg,#f3a33b 0 10px,transparent 10px 13px)}
.timer.danger div{background:repeating-linear-gradient(90deg,#e5484d 0 10px,transparent 10px 13px)}
.qtext{font-size:clamp(18px,2.6vw,21px);font-weight:700;line-height:1.45;margin:0 0 16px}
.topic-chip{display:inline-block;font-size:13px;font-weight:700;color:#fff;background:var(--navy);padding:3px 10px;margin-bottom:12px}
.choices{display:grid;gap:12px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--field);border:3px solid var(--edge);border-radius:0;padding:13px 14px;min-height:54px;color:#2a1d13;
  box-shadow:4px 4px 0 0 rgba(0,0,0,.12)}
.choice .k{flex:0 0 auto;font-family:var(--pixel);font-size:10px;color:#fff8e7;background:var(--ox);padding:5px 7px;margin-top:1px}
.choice:hover:not(:disabled){border-color:var(--navy);background:#f2f7fd}
.choice:hover:not(:disabled) .k{background:var(--navy)}
.choice.right{border-color:#1b7a43;background:#e3f5ea;opacity:1} .choice.right .k{background:#1b7a43}
.choice.wrong{border-color:#b3261e;background:#fbe5e3;opacity:1} .choice.wrong .k{background:#b3261e}
.fb{margin-top:18px;border:3px solid var(--edge);padding:14px 16px;background:#f6eedb}
.fb.good{border-color:#1b7a43;background:#eef8f1} .fb.bad{border-color:#b3261e;background:#fcf0ee}
.fb .verdict{font-family:var(--pixel);font-size:14px;margin-bottom:10px;line-height:1.6}
.fb.good .verdict{color:var(--green)} .fb.bad .verdict{color:var(--red)}
.whywrong{margin:10px 0;padding:10px 12px;background:#fff;border-left:6px solid #b3261e}
.whywrong b{color:#8f1d16}
.choice-notes{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.choice-notes li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:15px;padding:8px 10px;background:#fff;border:2px solid var(--line)}
.choice-notes li .m{font-weight:800}
.choice-notes li.ok .m{color:#1b7a43} .choice-notes li.no .m{color:#b3261e}
.choice-notes li .ct{font-weight:700}
.src{margin-top:12px;border-left:5px solid var(--line);padding:4px 0 4px 12px}
.src.verified{border-left-color:#1b7a43} .src.unverified{border-left-color:#c98a1a}
.src-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:700;color:var(--muted)}
.src blockquote{margin:6px 0 0;font-size:15px;font-style:italic;color:#3b2d20}
.badge{font-family:var(--pixel);font-size:8px;padding:4px 6px;color:#fff}
.badge.ok{background:#1b7a43}
.badge.warn{background:#b8740f}
.pts{font-family:var(--pixel);font-size:11px;color:#7d5a0c;margin-left:8px}
.next-row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

/* element check */
.facts{background:var(--field);border:3px solid var(--edge);border-left:8px solid var(--navy);padding:14px;margin-bottom:16px;font-size:17px}
.facts::before{content:"FACTS";display:block;font-family:var(--pixel);font-size:9px;color:var(--navy);margin-bottom:8px}
.rule-name{font-family:var(--pixel);font-size:12px;color:var(--pink);line-height:1.7;margin-bottom:12px}
.els{display:grid;gap:10px;margin-bottom:16px}
.elx{display:flex;gap:12px;align-items:flex-start;text-align:left;background:var(--field);border:3px solid var(--edge);padding:12px;color:#2a1d13}
.elx .box{flex:0 0 24px;height:24px;border:3px solid var(--navy);display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:#fff}
.elx.on .box{background:var(--navy)}
.elx.on{border-color:var(--navy);background:#f2f7fd}
.elx.right{border-color:#1b7a43} .elx.wrong{border-color:#b3261e}
.elx .why{display:block;font-size:14px;color:var(--muted);margin-top:4px}
.outcomes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.oc{background:var(--field);border:3px solid var(--edge);padding:14px 10px;font-family:var(--pixel);font-size:11px;color:#2a1d13;text-transform:uppercase}
.oc.on{border-color:var(--ox);color:#fff8e7;background:var(--ox)}
.elx:disabled,.oc:disabled{opacity:1}
.elx.wrong .why{color:#8f1d16}

/* results */
.verdict-label{text-align:center;font-family:var(--pixel);font-size:10px;letter-spacing:3px;color:#fbf3e2;margin-top:4px}
.big-score{font-family:var(--pixel);font-size:clamp(28px,8vw,48px);color:#f6cd57;text-align:center;margin:12px 0;letter-spacing:4px;
  text-shadow:3px 3px 0 #b5651d,6px 6px 0 var(--wood-dark)}
.newhigh{font-family:var(--pixel);text-align:center;color:#2a1d13;background:#f6cd57;font-size:clamp(12px,3.4vw,16px);
  width:fit-content;margin:8px auto 20px;padding:12px 16px;animation:flash .5s steps(2) infinite;
  box-shadow:0 -4px 0 0 #2b190e,0 4px 0 0 #2b190e,-4px 0 0 0 #2b190e,4px 0 0 0 #2b190e}
@keyframes flash{50%{background:#fff8e7}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:24px;margin:16px 4px 30px}
.stat{padding:16px 12px;text-align:center}
.stat .v{font-family:var(--pixel);font-size:16px;color:var(--cyan);margin-top:6px}
.stat .l{font-size:14px;color:var(--muted);font-weight:700}
.miss{border-top:3px dashed var(--line);padding:14px 0}
.miss:first-of-type{border-top:0}
.miss .mq{font-weight:700;margin:4px 0 6px}
.miss .ma{font-size:15px}
.miss .ma b{color:#1b7a43} .miss .ma i{color:#b3261e;font-style:normal;font-weight:700}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(18,10,5,.78);z-index:150;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.confetti{position:fixed;top:-12px;width:10px;height:10px;z-index:160;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.shake{animation:shake .4s steps(5)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

@media (max-width:620px){
  .tiles{grid-template-columns:1fr}
  .tile{min-height:0}
  .mbar{grid-template-columns:1fr 52px}
  .mbar .track{grid-column:1 / -1;grid-row:2}
  .logo{font-size:10px;gap:6px}
  .coins{font-size:9px;margin-right:2px}
  .card{padding:18px}
  .card > .h2:first-child{margin:-12px -12px 14px}
  .btn{font-size:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="logo" id="logoBtn" aria-label="Evidence Arcade home"><span id="logoIco"></span><span>EVIDENCE <span class="arc">ARCADE</span></span></button>
  <div class="hud-top">
    <div class="coins" id="coins" title="Total points earned">1UP 000000</div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings" title="Settings">⚙️</button>
    <button class="icon-btn" id="muteBtn" aria-label="Toggle sound">🔊</button>
  </div>
</header>
<main id="app"><noscript>Evidence Arcade needs JavaScript turned on.</noscript></main>
<footer>AI-generated questions can be wrong. Check against the rules and your notes. Don't upload anything confidential.</footer>

<script>

const SAMPLE_NOTES = `EVIDENCE: HEARSAY UNIT (sample notes)

1. Definition (FRE 801(c))
Hearsay = (1) a statement, (2) made by the declarant other than while testifying at the current trial, (3) offered to prove the truth of the matter asserted. Always ask: what is the statement being offered to prove?

Not offered for truth (so not hearsay): verbal acts or legally operative words (a contract offer, defamatory words), effect on the listener (a warning shows notice), circumstantial evidence of the declarant's state of mind, and impeachment with a prior inconsistent statement.

2. Exclusions: FRE 801(d)
Prior statements of a testifying witness (801(d)(1)): an inconsistent statement given under penalty of perjury; a consistent statement offered to rebut a charge of recent fabrication; a prior identification.
Tome v. United States (1995): a prior consistent statement offered to rebut a charge of recent fabrication is admissible only if it was made before the alleged motive to fabricate arose.
Opposing party's statements (801(d)(2)): own statement, adopted, authorized, agent or employee within scope, coconspirator during and in furtherance.
Bourjaily v. United States (1987): the court decides preliminary facts for a coconspirator statement by a preponderance of the evidence and may consider the statement itself.

3. Exceptions where availability is immaterial (FRE 803)
Present sense impression: describes the event while or immediately after the declarant perceived it.
Excited utterance: a startling event plus a statement made under the stress of the excitement. The time gap is not decisive; ask whether the declarant was still under stress.
State of mind (803(3)): Mutual Life Insurance Co. v. Hillmon (1892): letters stating Walters' intent to travel with Hillmon were admissible to show Walters' intent and, from that, that he likely went.
Medical diagnosis or treatment: statements about the cause of an injury are fine, but statements assigning fault usually are not.
Business records (803(6)): made at or near the time, by someone with knowledge, kept in the regular course of business, and it was a regular practice to make the record.

4. Exceptions requiring the declarant to be unavailable (FRE 804)
Dying declaration: homicide prosecution or civil case; the declarant believed death was imminent; the statement concerns the cause or circumstances of death.
Shepard v. United States (1933): Mrs. Shepard's statement "Dr. Shepard has poisoned me" was not a dying declaration because she did not speak with a settled, hopeless expectation of death.
Statement against interest: Williamson v. United States (1994): only the individual self-inculpatory statements qualify, not collateral statements in a broader narrative.

5. Confrontation Clause
Crawford v. Washington (2004): testimonial statements of a witness absent from trial are admissible against a criminal defendant only if the witness is unavailable and the defendant had a prior opportunity for cross-examination.`;

function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on") && typeof v === "function") n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    n.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return n;
}
function screen(...kids) {
  cleanup.forEach(f => { try { f(); } catch (e) {} });
  cleanup = []; keyHandler = null; inGame = false;
  app.replaceChildren(...kids.flat(Infinity).filter(k => k != null && k !== false));
  window.scrollTo(0, 0);
}
document.addEventListener("keydown", e => {
  if (!keyHandler) return;
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  keyHandler(e);
});

const STALL_MS = 60000;            // give up on a model that sends nothing new for this long
const MAX_THINKING_CHARS = 20000;  // give up on a model that "thinks" this much without starting its answer

async function callAI(messages, signal) {
  if (!currentKey()) throw new AppError("NO_KEY", "Add your OpenRouter API key to generate questions.");
  for (let attempt = 1; ; attempt++) {
    try { return await callOnce(messages, signal, attempt); }
    catch (e) {
      if (e.name === "AbortError" || !e.retry) throw e;
      if (attempt >= MAX_ATTEMPTS) {

    402: "OpenRouter says this request needs credits. Make sure you're using a free model (ID ending in :free, or openrouter/free).",
    404: "That model wasn't found or has no available provider right now. Pick another model under ⚙️ Settings.",
    429: "Rate limited: free models allow a limited number of requests per minute. Wait a moment and try again." };

async function generate(game, { focus = null, append = false, signal } = {}) {
  const g = GEN[game];
  const n = focus ? g.focusN : g.n;
  const user = contextBlock() + g.prompt(n) + sourceRules(focus);
  const { content, model } = await callAI([{ role: "system", content: SYS }, { role: "user", content: user }], signal);
  let items = VALIDATE[game](extractJSON(content));
  if (focus) {
    const focused = items.filter(it => focus.includes(it.topic));
    if (focused.length) items = focused;
  }
  if (!items.length) throw new AppError("PARSE", "The model's answer didn't contain any usable questions. Try again, or pick another model under ⚙️ Settings.");
  items.forEach(it => { it.id = uid(); it.played = false; });
  S.packs[game] = append ? S.packs[game].concat(items) : items;
  S.packMeta[game] = { hash: notesHash(), model, at: Date.now() };
  save();
  return items;
}

async function readPdf(file, onProgress) {
  if (!window.pdfjsLib) throw new Error("The PDF reader didn't load. Check your connection, or paste the text instead.");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const out = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    onProgress && onProgress(p, pdf.numPages);
    const tc = await (await pdf.getPage(p)).getTextContent();
    out.push(tc.items.map(i => i.str + (i.hasEOL ? "\n" : " ")).join(""));
  }
  return out.join("\n\n");
}

  function next() {
    if (st.i >= st.items.length || (st.lives !== null && st.lives <= 0)) return finish();
    const it = st.items[st.i];
    if (it.type === "rapid") renderRapid(it); else renderElement(it);
    inGame = true;
  }
  function advance() { st.i++; next(); }
  function finish() {
    save();
    showResults({ game: mode, score: st.score, correct: st.got, total: st.parts, bestStreak: st.bestStreak, topics: st.topics, missed: st.missed,
      headline: st.lives === 0 ? "GAME OVER" : "CASE CLOSED", extra: st.lives !== null ? [["Lives left", String(st.lives)]] : [] });
  }

  function renderRapid(it) {
    const order = shuffle([0, 1, 2, 3]);
    const LIMIT = 20; const t0 = performance.now(); let done = false;
    const bar = el("div", { style: "width:100%" }), timer = el("div", { class: "timer" }, bar);
    const btns = order.map((ci, pos) => el("button", { class: "choice", onclick: () => answer(ci) }, el("span", { class: "k" }, pos + 1), el("span", {}, it.choices[ci])));
    const fbWrap = el("div");
    screen(hudBar(st, title), timer,
      el("div", { class: "card" }, el("span", { class: "topic-chip" }, TOPIC_BY_KEY[it.topic].label),
        el("div", { class: "qtext" }, it.question), el("div", { class: "choices" }, btns), fbWrap));
    inGame = true;
    const iv = setInterval(() => {
      const left = Math.max(0, LIMIT - (performance.now() - t0) / 1000);
      bar.style.width = (left / LIMIT * 100) + "%";
      timer.className = "timer" + (left < 5 ? " danger" : left < 10 ? " warn" : "");
      if (left <= 0) answer(null);
    }, 100);
    cleanup.push(() => clearInterval(iv));
    keyHandler = e => { const n = parseInt(e.key, 10); if (!done && n >= 1 && n <= 4) answer(order[n - 1]); };
    function answer(ci) {
      if (done) return; done = true; clearInterval(iv);
      const secsLeft = Math.max(0, LIMIT - (performance.now() - t0) / 1000);
      const ok = ci === it.answer;
      btns.forEach((b, pos) => { b.disabled = true; if (order[pos] === it.answer) b.classList.add("right"); else if (order[pos] === ci) b.classList.add("wrong"); });
      let pts = 0;
      if (ok) { st.streak++; st.bestStreak = Math.max(st.bestStreak, st.streak); pts = Math.round((100 + secsLeft * 5) * streakMult(st.streak)); st.score += pts; st.got++; Sound.play("good"); }
      else {
        st.streak = 0; if (st.lives !== null) st.lives--; Sound.play("bad");
        const card = btns[0].closest(".card"); card.classList.add("shake"); setTimeout(() => card.classList.remove("shake"), 450);
        st.missed.push({ game: title, topic: it.topic, prompt: it.question, yours: ci === null ? "(time ran out)" : it.choices[ci], correct: it.choices[it.answer], why: it.explanation, whyWrong: ci !== null && it.why && it.why[ci] ? it.why[ci] : "", source: it.source, srcLabel: srcLabelText(it) });
      }
      st.parts++; it.played = true; recordMastery(it.topic, ok ? 1 : 0); addTopic(st, it.topic, ok ? 1 : 0);
      const nextBtn = el("button", { class: "btn solid", onclick: advance }, st.lives === 0 ? "GAME OVER ▶" : "NEXT ▶");
      fbWrap.replaceChildren(el("div", { class: "fb " + (ok ? "good" : "bad") },
        el("div", { class: "verdict" }, ok ? "CORRECT!" : ci === null ? "TIME'S UP!" : "MISS!", ok ? el("span", { class: "pts" }, `+${fmt(pts)}`) : null),
        !ok ? el("div", { style: "margin-bottom:6px" }, "Answer: ", el("b", {}, it.choices[it.answer])) : null,
        !ok && ci !== null && it.why && it.why[ci] ? el("div", { class: "whywrong" }, el("b", {}, "Why your answer is wrong: "), it.why[ci]) : null,
        it.explanation ? el("div", {}, el("b", {}, "Why the answer is right: "), it.explanation) : null,
        it.why && it.why.length === 4 ? el("ul", { class: "choice-notes", "aria-label": "Why each choice is right or wrong" }, order.map(oi =>
          el("li", { class: oi === it.answer ? "ok" : "no" }, el("span", { class: "m" }, oi === it.answer ? "✓" : "✗"),
            el("span", {}, el("span", { class: "ct" }, it.choices[oi] + ": "), it.why[oi])))) : null,
        sourceBox(it),
        el("div", { class: "next-row" }, nextBtn)));
      // refresh HUD
      app.firstChild.replaceWith(hudBar(st, title));
      nextBtn.focus({ preventScroll: true }); fbWrap.scrollIntoView({ behavior: "smooth", block: "nearest" });
      keyHandler = e => { if (e.key === "Enter") { e.preventDefault(); advance(); } };
    }
  }

  function renderElement(it) {
    const checked = it.elements.map(() => false); let outcome = null, done = false;
    const elBtns = it.elements.map((e, idx) => {
      const b = el("button", { class: "elx", "aria-pressed": "false", onclick: () => { if (done) return; checked[idx] = !checked[idx]; b.classList.toggle("on", checked[idx]); b.setAttribute("aria-pressed", String(checked[idx])); b.querySelector(".box").textContent = checked[idx] ? "✓" : ""; Sound.play("click"); } },
        el("span", { class: "box" }), el("span", {}, e.text));
      return b;
    });
    const ocBtns = ["admissible", "inadmissible"].map(o => el("button", { class: "oc", onclick: () => pickOutcome(o) }, o === "admissible" ? "✔ Admissible" : "✖ Inadmissible"));
    const submit = el("button", { class: "btn solid", disabled: true, onclick: grade }, "SUBMIT");
    const fbWrap = el("div");
    function pickOutcome(o) { if (done) return; outcome = o; ocBtns.forEach((b, i) => b.classList.toggle("on", ["admissible", "inadmissible"][i] === o)); submit.disabled = false; Sound.play("click"); }
    screen(hudBar(st, title),
      el("div", { class: "card" }, el("span", { class: "topic-chip" }, TOPIC_BY_KEY[it.topic].label),
        el("div", { class: "rule-name" }, it.rule),
        el("div", { class: "facts" }, it.facts),
        el("div", { class: "small muted", style: "margin-bottom:8px" }, "Tap each element the facts SATISFY:"),
        el("div", { class: "els" }, elBtns),
        el("div", { class: "small muted", style: "margin-bottom:8px" }, "Outcome under this rule:"),
        el("div", { class: "outcomes" }, ocBtns),
        el("div", { class: "next-row" }, submit), fbWrap));
    inGame = true;
    keyHandler = e => { const k = e.key.toLowerCase(); if (k === "a") pickOutcome("admissible"); else if (k === "i") pickOutcome("inadmissible"); else if (k === "enter" && outcome && !done) grade(); else { const n = parseInt(k, 10); if (n >= 1 && n <= elBtns.length) elBtns[n - 1].click(); } };
    function grade() {
      if (done || !outcome) return; done = true; submit.remove();
      let right = 0;
      it.elements.forEach((e, idx) => {
        const ok = checked[idx] === e.met; if (ok) right++;
        const b = elBtns[idx]; b.disabled = true; b.classList.add(ok ? "right" : "wrong");
        b.children[1].append(el("span", { class: "why" }, (ok ? `✓ ${e.met ? "Met" : "Not met"}.` : `✗ You said ${checked[idx] ? "met" : "not met"}, but it's ${e.met ? "met" : "NOT met"}.`) + (e.why ? " " + e.why : "")));
      });
      const ocOk = outcome === it.outcome;
      ocBtns.forEach((b, i) => { b.disabled = true; const o = ["admissible", "inadmissible"][i]; if (o === it.outcome) b.style.borderColor = "var(--green)"; else if (o === outcome) b.style.borderColor = "var(--red)"; });
      const parts = it.elements.length + 1, got = right + (ocOk ? 1 : 0), perfect = got === parts;
      let pts = right * 50 + (ocOk ? 100 : 0);
      if (perfect) { st.streak++; st.bestStreak = Math.max(st.bestStreak, st.streak); pts = Math.round(pts * streakMult(st.streak)); Sound.play("good"); }
      else { st.streak = 0; Sound.play("bad"); }
      st.score += pts; st.got += got; st.parts += parts; it.played = true;
      recordMastery(it.topic, got / parts); addTopic(st, it.topic, got / parts);
      if (!perfect) st.missed.push({ game: title, topic: it.topic, prompt: `${it.rule}: ${it.facts}`,
        yours: `Checked: ${it.elements.filter((e, i) => checked[i]).map(e => e.text).join("; ") || "(none)"}. Outcome: ${outcome}.`,
        correct: `Met: ${it.elements.filter(e => e.met).map(e => e.text).join("; ") || "(none)"}. Outcome: ${it.outcome}.`,
        whyWrong: it.elements.map((e, i) => checked[i] === e.met ? "" : `“${e.text}” is ${e.met ? "met" : "NOT met"}${e.why ? ": " + e.why : "."}`).filter(Boolean)
          .concat(ocOk ? [] : [`The outcome is ${it.outcome} because ${it.outcome === "admissible" ? "every element is met" : "at least one element isn't met"}.`]).join(" "),
        why: it.explanation, source: it.source, srcLabel: srcLabelText(it) });
      const nextBtn = el("button", { class: "btn solid", onclick: advance }, "NEXT ▶");
      fbWrap.replaceChildren(el("div", { class: "fb " + (perfect ? "good" : "bad") },
        el("div", { class: "verdict" }, perfect ? "PERFECT!" : `${got}/${parts} RIGHT`, el("span", { class: "pts" }, `+${fmt(pts)}`)),
        el("div", { style: "margin-bottom:6px" }, "Correct outcome: ", el("b", {}, it.outcome.toUpperCase()), ocOk ? " ✓" : " (you said " + outcome + ")"),
        !ocOk ? el("div", { class: "whywrong" }, el("b", {}, "Why your outcome was wrong: "), it.outcome === "admissible"
          ? "Every element is met, so the evidence comes in under this rule."
          : "At least one element isn't met (marked NOT met above), so the evidence doesn't come in under this rule.") : null,
        it.explanation ? el("div", {}, it.explanation) : null, sourceBox(it), el("div", { class: "next-row" }, nextBtn)));
      app.firstChild.replaceWith(hudBar(st, title));
      nextBtn.focus({ preventScroll: true }); fbWrap.scrollIntoView({ behavior: "smooth", block: "nearest" });
      keyHandler = e => { if (e.key === "Enter") { e.preventDefault(); advance(); } };
    }
  }
}

/* =====================================================================
   RESULTS
   ===================================================================== */
function showResults(r) {
  const prevHigh = S.highs[r.game] || 0;
  const isHigh = r.score > 0 && r.score > prevHigh;
  if (isHigh) S.highs[r.game] = r.score;
  S.coins = (S.coins || 0) + r.score;
  const stamp = new Date().toISOString();
  S.missed = r.missed.map(m => ({ ...m, at: stamp })).concat(S.missed).slice(0, 300);
  save(); updateCoins();

  const scoreEl = el("div", { class: "big-score" }, padScore(0));
  const acc = r.total ? Math.round(r.correct / r.total * 100) : 0;
  const stats = [["Accuracy", acc + "%"]].concat(r.bestStreak !== null ? [["Best streak", String(r.bestStreak)]] : [], r.extra || [], [["High score", padScore(Math.max(prevHigh, r.score))]]);
  const topicRows = Object.entries(r.topics).sort((a, b) => a[1].c / a[1].t - b[1].c / b[1].t).map(([k, v]) => {
    const p = v.c / v.t;
    return el("div", { class: "mbar" + (p < 0.6 ? " weak" : "") }, el("div", { style: "font-weight:600" }, TOPIC_BY_KEY[k].label),
      el("div", { class: "track" }, el("div", { class: "fill", style: `width:${Math.round(p * 100)}%` })), el("div", { class: "pct" }, Math.round(p * 100) + "%"));
  });
  const missList = r.missed.map(m => el("div", { class: "miss" },
    el("span", { class: "topic-chip" }, TOPIC_BY_KEY[m.topic] ? TOPIC_BY_KEY[m.topic].label : m.topic),
    el("div", { class: "mq" }, m.prompt),
    el("div", { class: "ma" }, el("i", {}, "You: " + m.yours)),
    el("div", { class: "ma" }, el("b", {}, "Correct: " + m.correct)),
    m.whyWrong ? el("div", { class: "whywrong small" }, el("b", {}, "Why yours was wrong: "), m.whyWrong) : null,
    m.why ? el("div", { class: "small muted", style: "margin-top:4px" }, el("b", {}, "Why: "), m.why) : null,
    sourceBox(m)));
  const replayGame = r.game;
  screen(
    el("div", { class: "h1", style: "text-align:center" }, r.headline),
    el("div", { class: "verdict-label" }, "THE VERDICT"),
    scoreEl,
    isHigh ? el("div", { class: "newhigh" }, "★ NEW HIGH SCORE ★") : null,
    el("div", { class: "stats" }, stats.map(([l, v]) => el("div", { class: "stat" }, el("div", { class: "l" }, l), el("div", { class: "v" }, v)))),
    topicRows.length ? el("div", { class: "card" }, el("div", { class: "h2" }, "THIS ROUND BY TOPIC"), topicRows) : null,
    el("div", { class: "card" }, el("div", { class: "h2" }, r.missed.length ? `MISSED (${r.missed.length})` : "NO MISSES!"),
      r.missed.length ? missList : el("p", { class: "muted", style: "margin:0" }, "Flawless round. Nothing to review."),
      r.missed.length ? el("div", { class: "row", style: "margin-top:12px" }, el("button", { class: "btn small", onclick: () => downloadMissed(r.missed.map(m => ({ ...m, at: stamp })), `evidence-arcade-${replayGame}-misses.txt`) }, "⬇ Download these misses (.txt)")) : null),
    el("div", { class: "row" },
      el("button", { class: "btn solid", onclick: () => { Sound.play("coin"); replayGame === "weak" ? showWeakIntro() : startGame(replayGame); } }, "▶ PLAY AGAIN"),
      el("button", { class: "btn", onclick: () => freshQuestions(replayGame) }, "↻ Fresh questions"),
      el("button", { class: "btn ghost", onclick: showHub }, "Back to hub")));
  // count-up animation
  const t0 = performance.now(), dur = 900;
  const tick = () => { const p = Math.min(1, (performance.now() - t0) / dur); scoreEl.textContent = padScore(r.score * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  if (isHigh) { Sound.play("high"); confetti(); } else Sound.play(acc >= 60 ? "coin" : "over");
}

function downloadMissed(list, filename) {
  if (!list.length) return;
  const lines = ["EVIDENCE ARCADE · REVIEW SHEET", `Generated ${new Date().toLocaleString()}`, `${list.length} missed item${list.length === 1 ? "" : "s"}`,
    "AI-generated questions can be wrong. Check against the rules and your notes.", ""];
  list.forEach((m, i) => {
    lines.push(`${i + 1}. [${TOPIC_BY_KEY[m.topic] ? TOPIC_BY_KEY[m.topic].label : m.topic}] ${m.game}`);
    lines.push(`   Q: ${m.prompt}`, `   Your answer: ${m.yours}`, `   Correct: ${m.correct}`);
    if (m.whyWrong) lines.push(`   Why yours was wrong: ${m.whyWrong}`);
    if (m.why) lines.push(`   Why: ${m.why}`);
    if (m.source) lines.push(`   Source (${m.srcLabel || "unchecked"}): "${m.source}"`);
    lines.push("");
  });
  const blob = new Blob([lines.join("\n")], { type: "text/plain" });
  const a = el("a", { href: URL.createObjectURL(blob), download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* =====================================================================
   BOOT
   ===================================================================== */
document.getElementById("settingsBtn").addEventListener("click", () => { Sound.play("click"); openSettings(); });
document.getElementById("muteBtn").addEventListener("click", () => { S.settings.muted = !S.settings.muted; save(); updateMute(); Sound.play("click"); });
document.getElementById("logoBtn").addEventListener("click", () => {
  if (inGame) quitConfirm(); else if (S.notes || Object.values(S.packs).some(p => p.length)) showHub(); else showSetup();
});
document.getElementById("logoIco").append(sprite("scales", 2));
updateCoins(); updateMute();
showSetup();
</script>
