<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Arcade: Evidence Edition</title>
<meta name="description" content="Arcade-style study games for the Federal Rules of Evidence, powered by OpenRouter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" defer></script>
<style>
:root{
  --bg:#0a0718; --panel:#16113a; --panel2:#201956; --line:#3b3185;
  --text:#eeeaff; --muted:#a8a1da; --cyan:#2de2ff; --pink:#ff3fa4; --yellow:#ffe14d;
  --green:#3dff8f; --red:#ff4f6d; --orange:#ff9a3c;
  --pixel:"Press Start 2P", ui-monospace, monospace;
  --sans:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.5}
body{min-height:100vh;display:flex;flex-direction:column;
  background:radial-gradient(1100px 600px at 50% -220px,#2c1666 0%,transparent 70%),var(--bg)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:200;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px)}
a{color:var(--cyan)}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

/* ---------- header / footer ---------- */
header.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;background:rgba(10,7,24,.92);backdrop-filter:blur(6px);border-bottom:2px solid var(--line)}
.logo{background:none;border:0;padding:0;font-family:var(--pixel);font-size:14px;color:var(--cyan);
  text-shadow:0 0 8px rgba(45,226,255,.7);letter-spacing:1px;text-align:left}
.logo span{color:var(--pink);text-shadow:0 0 8px rgba(255,63,164,.7);margin-left:6px}
.hud-top{display:flex;align-items:center;gap:10px}
.coins{font-family:var(--pixel);font-size:11px;color:var(--yellow);text-shadow:0 0 6px rgba(255,225,77,.6);white-space:nowrap}
.icon-btn{background:var(--panel);border:2px solid var(--line);border-radius:8px;width:40px;height:40px;font-size:18px;line-height:1}
main{flex:1;width:100%;max-width:880px;margin:0 auto;padding:20px 16px 40px}
footer{padding:16px;text-align:center;color:var(--muted);font-size:13px;border-top:2px solid var(--line)}

/* ---------- generic ---------- */
.card{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:18px;margin:0 0 16px}
.h1{font-family:var(--pixel);font-size:clamp(18px,4.6vw,30px);line-height:1.35;margin:8px 0 12px;color:var(--yellow);
  text-shadow:3px 3px 0 #a02a6b,0 0 18px rgba(255,225,77,.35)}
.h2{font-family:var(--pixel);font-size:13px;line-height:1.6;margin:0 0 12px;color:var(--cyan)}
.step{display:inline-block;font-family:var(--pixel);font-size:10px;color:var(--bg);background:var(--cyan);padding:4px 7px;border-radius:4px;margin-right:8px;vertical-align:2px}
.muted{color:var(--muted)} .small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn{border:2px solid var(--cyan);background:transparent;color:var(--cyan);border-radius:10px;padding:11px 16px;font-weight:600;
  min-height:46px;transition:transform .08s, box-shadow .15s, background .15s}
.btn:hover:not(:disabled){box-shadow:0 0 14px rgba(45,226,255,.45);background:rgba(45,226,255,.08)}
.btn:active:not(:disabled){transform:translateY(2px)}
.btn.pink{border-color:var(--pink);color:var(--pink)} .btn.pink:hover:not(:disabled){box-shadow:0 0 14px rgba(255,63,164,.5);background:rgba(255,63,164,.08)}
.btn.yellow{border-color:var(--yellow);color:var(--yellow)}
.btn.ghost{border-color:var(--line);color:var(--muted)}
.btn.solid{background:var(--pink);border-color:var(--pink);color:#fff;font-family:var(--pixel);font-size:12px;letter-spacing:1px}
.btn.solid:hover:not(:disabled){background:#ff5cb3}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.pixel{font-family:var(--pixel)}
.coin-btn{display:block;width:100%;margin:22px 0 6px;padding:22px;font-family:var(--pixel);font-size:clamp(14px,4vw,20px);
  color:var(--bg);background:var(--yellow);border:0;border-radius:14px;box-shadow:0 6px 0 #b38d00,0 0 30px rgba(255,225,77,.35);
  animation:blink 1.4s steps(2,start) infinite}
.coin-btn:hover{filter:brightness(1.08)} .coin-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b38d00}
@keyframes blink{50%{opacity:.82}}
input[type=text],input[type=password],select,textarea{width:100%;background:#0d0a24;border:2px solid var(--line);border-radius:10px;color:var(--text);
  padding:11px 12px;font:inherit;font-size:15px}
textarea{resize:vertical;min-height:180px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(45,226,255,.2)}
label.lbl{display:block;font-weight:600;margin:10px 0 6px}
details.adv summary{cursor:pointer;font-weight:600;color:var(--muted);padding:4px 0}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;background:#0d0a24;border:2px solid var(--line);border-radius:10px;padding:9px;font-weight:600;color:var(--muted)}
.tab.on{border-color:var(--cyan);color:var(--cyan);background:rgba(45,226,255,.08)}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:28px 16px;text-align:center;cursor:pointer;color:var(--muted)}
.drop.over{border-color:var(--cyan);color:var(--cyan)}
.drop input{display:none}
.status{font-size:14px;margin-top:8px;min-height:1.2em}
.status.ok{color:var(--green)} .status.err{color:var(--red)}
.notice{border:2px solid var(--orange);color:#ffd2a6;background:rgba(255,154,60,.08);border-radius:12px;padding:12px 14px;margin:0 0 16px;font-size:14px}

/* ---------- hub ---------- */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:16px}
.tile{position:relative;text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:16px;min-height:160px;
  display:flex;flex-direction:column;gap:8px;transition:transform .1s, border-color .15s, box-shadow .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--pink);box-shadow:0 0 22px rgba(255,63,164,.3)}
.tile .ico{font-size:28px;line-height:1}
.tile .tname{font-family:var(--pixel);font-size:12px;color:var(--yellow);line-height:1.5}
.tile .tdesc{font-size:14px;color:var(--muted);flex:1}
.tile .thi{font-family:var(--pixel);font-size:9px;color:var(--cyan);line-height:1.8}
.weak-btn{width:100%;text-align:left;display:flex;gap:14px;align-items:center;background:linear-gradient(90deg,rgba(255,63,164,.16),rgba(45,226,255,.08));
  border:2px solid var(--pink);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.weak-btn .ico{font-size:26px}
.mbar{display:grid;grid-template-columns:minmax(120px,210px) 1fr 52px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.mbar .track{height:14px;background:#0d0a24;border:2px solid var(--line);border-radius:4px;overflow:hidden}
.mbar .fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));transition:width .6s}
.mbar.weak .fill{background:linear-gradient(90deg,var(--red),var(--orange))}
.mbar .pct{font-family:var(--pixel);font-size:10px;text-align:right}
.tag{display:inline-block;font-family:var(--pixel);font-size:8px;padding:3px 5px;border-radius:3px;background:var(--red);color:#fff;margin-left:6px;vertical-align:2px}

/* ---------- loading ---------- */
.loading{text-align:center;padding:30px 0}
.loadbar{height:22px;border:3px solid var(--cyan);border-radius:4px;padding:3px;margin:26px auto;max-width:420px}
.loadbar div{height:100%;width:30%;background:repeating-linear-gradient(90deg,var(--cyan) 0 14px,transparent 14px 18px);animation:load 1.6s linear infinite}
@keyframes load{0%{margin-left:-30%}100%{margin-left:100%}}
.loadbar{overflow:hidden}
.tip{max-width:560px;margin:18px auto;text-align:left}

/* ---------- game ---------- */
.ghud{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-family:var(--pixel);font-size:10px;margin-bottom:14px;
  background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px}
.ghud .gt{color:var(--yellow)}
.ghud .sc{color:var(--cyan)}
.ghud .streak{color:var(--orange)}
.ghud .lives{color:var(--red);font-size:13px;letter-spacing:2px}
.timer{height:10px;background:#0d0a24;border:2px solid var(--line);border-radius:4px;overflow:hidden;margin:0 0 14px}
.timer div{height:100%;background:var(--green);transition:width .1s linear}
.timer.warn div{background:var(--orange)} .timer.danger div{background:var(--red)}
.qtext{font-size:clamp(17px,2.6vw,20px);font-weight:600;line-height:1.45;margin:0 0 16px}
.topic-chip{display:inline-block;font-size:12px;color:var(--cyan);border:1px solid var(--cyan);border-radius:20px;padding:2px 10px;margin-bottom:10px}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#0d0a24;border:2px solid var(--line);border-radius:12px;padding:13px 14px;min-height:52px}
.choice .k{font-family:var(--pixel);font-size:11px;color:var(--pink);padding-top:4px;min-width:16px}
.choice:hover:not(:disabled){border-color:var(--cyan)}
.choice.right{border-color:var(--green);background:rgba(61,255,143,.12);opacity:1}
.choice.wrong{border-color:var(--red);background:rgba(255,79,109,.12);opacity:1}
.fb{margin-top:16px;border:2px solid var(--line);border-radius:12px;padding:14px;background:var(--panel2)}
.fb.good{border-color:var(--green)} .fb.bad{border-color:var(--red)}
.fb .verdict{font-family:var(--pixel);font-size:13px;margin-bottom:8px;line-height:1.6}
.fb.good .verdict{color:var(--green)} .fb.bad .verdict{color:var(--red)}
.src{margin-top:12px;border-left:4px solid var(--line);padding:4px 0 4px 12px}
.src.verified{border-left-color:var(--green)} .src.unverified{border-left-color:var(--orange)}
.src-h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;font-weight:600;color:var(--muted)}
.src blockquote{margin:6px 0 0;font-size:14px;font-style:italic;color:#d8d3ff}
.badge{font-family:var(--pixel);font-size:8px;padding:4px 6px;border-radius:3px}
.badge.ok{background:var(--green);color:#062}
.badge.warn{background:var(--orange);color:#3a1b00}
.pts{font-family:var(--pixel);font-size:11px;color:var(--yellow);margin-left:8px}
.next-row{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

/* element check */
.facts{background:#0d0a24;border:2px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px;font-size:16px}
.rule-name{font-family:var(--pixel);font-size:12px;color:var(--yellow);line-height:1.6;margin-bottom:10px}
.els{display:grid;gap:8px;margin-bottom:14px}
.elx{display:flex;gap:12px;align-items:flex-start;text-align:left;background:#0d0a24;border:2px solid var(--line);border-radius:10px;padding:12px}
.elx .box{flex:0 0 22px;height:22px;border:2px solid var(--cyan);border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--bg)}
.elx.on .box{background:var(--cyan)}
.elx.on{border-color:var(--cyan)}
.elx.right{border-color:var(--green)} .elx.wrong{border-color:var(--red)}
.elx .why{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.outcomes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px}
.oc{background:#0d0a24;border:2px solid var(--line);border-radius:10px;padding:12px;font-weight:700}
.oc.on{border-color:var(--pink);color:var(--pink);background:rgba(255,63,164,.08)}

/* objection */
.setup{font-size:15px;color:var(--muted);margin-bottom:12px}
.transcript{background:#f7f3e3;color:#1b1630;border-radius:10px;padding:14px 16px;font-family:"Courier New",Courier,monospace;font-size:15px;
  box-shadow:inset 0 0 0 2px #d8cfa8;margin-bottom:14px}
.tl{display:grid;grid-template-columns:28px 1fr 26px;gap:6px;padding:6px 4px;border-radius:6px;line-height:1.45}
.tl .sp{font-weight:700}
.tl.cur{background:#ffe58a;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{background:#fff0b8}}
.tl .mk{font-weight:700;text-align:center}
.tl.ok .mk{color:#0a8a3a} .tl.no .mk{color:#c3123a}
.ctrl{position:sticky;bottom:0;background:rgba(10,7,24,.96);border:2px solid var(--line);border-radius:14px;padding:12px;z-index:5;
  max-height:70vh;overflow:auto}
.ctrl .big{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.obj-btn{font-family:var(--pixel);font-size:clamp(11px,2.8vw,14px);padding:18px 8px;border-radius:12px;border:0;line-height:1.4}
.obj-btn.in{background:var(--cyan);color:var(--bg)}
.obj-btn.obj{background:var(--red);color:#fff;box-shadow:0 0 18px rgba(255,79,109,.45)}
.grounds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:4px}
.ground{background:#0d0a24;border:2px solid var(--red);color:#ffd0d9;border-radius:10px;padding:11px;font-weight:600;text-align:left}
.ground .k{font-family:var(--pixel);font-size:10px;color:var(--yellow);margin-right:8px}
.ground:hover{background:rgba(255,79,109,.15)}

/* match */
.mgrid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:10px}
.mcol{display:grid;gap:10px;align-content:start}
.mi{text-align:left;background:#0d0a24;border:2px solid var(--line);border-radius:10px;padding:12px;min-height:56px;font-size:15px;transition:border-color .1s, background .1s}
.mi.l{font-weight:700}
.mi:hover:not(.done){border-color:var(--cyan)}
.mi.sel{border-color:var(--yellow);background:rgba(255,225,77,.1);box-shadow:0 0 12px rgba(255,225,77,.35)}
.mi.done{border-color:var(--green);background:rgba(61,255,143,.12);color:#c9ffe0;cursor:default}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.flash-bad{border-color:var(--red)!important;background:rgba(255,79,109,.15)!important}

/* results */
.big-score{font-family:var(--pixel);font-size:clamp(28px,8vw,48px);color:var(--yellow);text-align:center;margin:10px 0;text-shadow:0 0 18px rgba(255,225,77,.5)}
.newhigh{font-family:var(--pixel);text-align:center;color:var(--pink);font-size:clamp(13px,3.6vw,18px);animation:blink .6s steps(2,start) infinite;margin:6px 0 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:14px 0}
.stat{background:#0d0a24;border:2px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .v{font-family:var(--pixel);font-size:16px;color:var(--cyan);margin-top:6px}
.stat .l{font-size:13px;color:var(--muted)}
.miss{border-top:2px solid var(--line);padding:12px 0}
.miss:first-child{border-top:0}
.miss .mq{font-weight:600;margin:4px 0 6px}
.miss .ma{font-size:14px}
.miss .ma b{color:var(--green)} .miss .ma i{color:#ff9fb1;font-style:normal}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(5,3,15,.8);z-index:150;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{max-width:440px;width:100%}
.confetti{position:fixed;top:-12px;width:9px;height:9px;z-index:160;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

@media (max-width:620px){
  .tiles{grid-template-columns:1fr}
  .tile{min-height:0}
  .mbar{grid-template-columns:1fr 52px}
  .mbar .track{grid-column:1 / -1;grid-row:2}
  .grounds{grid-template-columns:1fr}
  .mgrid{grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:8px}
  .mi{padding:10px;font-size:14px}
  .logo{font-size:11px}
  .coins{font-size:9px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <button class="logo" id="logoBtn" aria-label="Study Arcade home">STUDY<span>ARCADE</span></button>
  <div class="hud-top">
    <div class="coins" id="coins" title="Total points earned">◉ 0</div>
    <button class="icon-btn" id="muteBtn" aria-label="Toggle sound">🔊</button>
  </div>
</header>
<main id="app"><noscript>Study Arcade needs JavaScript turned on.</noscript></main>
<footer>AI-generated questions can be wrong. Check against the rules and your notes. Don't upload anything confidential.</footer>

<script>
"use strict";
/* =====================================================================
   CONFIG
   ===================================================================== */
// WARNING: anything you put in DEFAULT_KEY is visible to EVERY visitor
// (View Source). Only use a separate key made just for this app, on an
// account with no credits (free models only), and delete it when done.
// Set it back to "" before sharing this code anywhere.
const DEFAULT_KEY = "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";
const DEFAULT_MODEL = "openrouter/free";
const MODELS = [
  { id: "openrouter/free", label: "openrouter/free (auto-picks an available free model)" },
  { id: "nvidia/nemotron-3-super-120b-a12b:free", label: "NVIDIA Nemotron 3 Super 120B (free)" },
  { id: "nvidia/nemotron-3.5-lightning:free", label: "NVIDIA Nemotron 3.5 Lightning (free)" },
  { id: "custom", label: "Custom model ID…" }
];
const API_URL = "https://openrouter.ai/api/v1/chat/completions";
const NOTES_CHAR_LIMIT = 20000;   // max characters of notes sent per request
const REQUEST_TIMEOUT_MS = 300000;

/* =====================================================================
   BUILT-IN RULE BANK (short paraphrases of the Federal Rules of Evidence)
   ===================================================================== */
const TOPICS = [
  { key: "relevance", label: "Relevance", range: "FRE 401–403", rules: [
    { n: "401", name: "Test for relevant evidence", t: "Evidence is relevant if it has any tendency to make a fact more or less probable than it would be without the evidence, and the fact is of consequence in determining the action." },
    { n: "402", name: "General admissibility of relevant evidence", t: "Relevant evidence is admissible unless the Constitution, a federal statute, these rules, or other Supreme Court rules provide otherwise. Irrelevant evidence is not admissible." },
    { n: "403", name: "Excluding relevant evidence for prejudice, confusion, or waste of time", t: "The court may exclude relevant evidence if its probative value is substantially outweighed by a danger of unfair prejudice, confusing the issues, misleading the jury, undue delay, wasting time, or needlessly presenting cumulative evidence." }
  ]},
  { key: "character", label: "Character Evidence", range: "FRE 404–406, 412–415", rules: [
    { n: "404(a)(1)", name: "Character evidence: prohibited uses", t: "Evidence of a person's character or character trait is not admissible to prove that on a particular occasion the person acted in accordance with the character or trait." },
    { n: "404(a)(2)", name: "Character evidence: exceptions for a criminal defendant or victim", t: "In a criminal case, a defendant may offer evidence of the defendant's pertinent trait, and if the evidence is admitted, the prosecutor may offer evidence to rebut it. Subject to Rule 412, a defendant may offer evidence of an alleged victim's pertinent trait, and if admitted, the prosecutor may rebut it and offer evidence of the defendant's same trait." },
    { n: "404(b)", name: "Other crimes, wrongs, or acts", t: "Evidence of any other crime, wrong, or act is not admissible to prove a person's character in order to show that on a particular occasion the person acted in accordance with the character. This evidence may be admissible for another purpose, such as proving motive, opportunity, intent, preparation, plan, knowledge, identity, absence of mistake, or lack of accident." },
    { n: "405", name: "Methods of proving character", t: "When evidence of a person's character or character trait is admissible, it may be proved by testimony about the person's reputation or by testimony in the form of an opinion. On cross-examination of the character witness, the court may allow an inquiry into relevant specific instances of the person's conduct. When a person's character or character trait is an essential element of a charge, claim, or defense, it may also be proved by relevant specific instances of the person's conduct." },
    { n: "406", name: "Habit; routine practice", t: "Evidence of a person's habit or an organization's routine practice may be admitted to prove that on a particular occasion the person or organization acted in accordance with the habit or routine practice, regardless of whether it is corroborated or whether there was an eyewitness." },
    { n: "412", name: "Sex-offense cases: the victim", t: "In a civil or criminal proceeding involving alleged sexual misconduct, evidence offered to prove that a victim engaged in other sexual behavior or to prove a victim's sexual predisposition is not admissible, except in narrow circumstances the rule specifies." },
    { n: "413–415", name: "Similar acts in sexual-assault and child-molestation cases", t: "In a criminal or civil case involving sexual assault or child molestation, the court may admit evidence that the defendant committed any other sexual assault or child molestation, and the evidence may be considered on any matter to which it is relevant." }
  ]},
  { key: "impeachment", label: "Impeachment & Witnesses", range: "FRE 607–613", rules: [
    { n: "607", name: "Who may impeach a witness", t: "Any party, including the party that called the witness, may attack the witness's credibility." },

const SAMPLE_NOTES = `EVIDENCE: HEARSAY UNIT (sample notes)

1. Definition (FRE 801(c))
Hearsay = (1) a statement, (2) made by the declarant other than while testifying at the current trial, (3) offered to prove the truth of the matter asserted. Always ask: what is the statement being offered to prove?

Not offered for truth (so not hearsay): verbal acts or legally operative words (a contract offer, defamatory words), effect on the listener (a warning shows notice), circumstantial evidence of the declarant's state of mind, and impeachment with a prior inconsistent statement.

2. Exclusions: FRE 801(d)
Prior statements of a testifying witness (801(d)(1)): an inconsistent statement given under penalty of perjury; a consistent statement offered to rebut a charge of recent fabrication; a prior identification.
Tome v. United States (1995): a prior consistent statement offered to rebut a charge of recent fabrication is admissible only if it was made before the alleged motive to fabricate arose.
Opposing party's statements (801(d)(2)): own statement, adopted, authorized, agent or employee within scope, coconspirator during and in furtherance.
Bourjaily v. United States (1987): the court decides preliminary facts for a coconspirator statement by a preponderance of the evidence and may consider the statement itself.

3. Exceptions where availability is immaterial (FRE 803)
Present sense impression: describes the event while or immediately after the declarant perceived it.
Excited utterance: a startling event plus a statement made under the stress of the excitement. The time gap is not decisive; ask whether the declarant was still under stress.
State of mind (803(3)): Mutual Life Insurance Co. v. Hillmon (1892): letters stating Walters' intent to travel with Hillmon were admissible to show Walters' intent and, from that, that he likely went.
Medical diagnosis or treatment: statements about the cause of an injury are fine, but statements assigning fault usually are not.
Business records (803(6)): made at or near the time, by someone with knowledge, kept in the regular course of business, and it was a regular practice to make the record.

4. Exceptions requiring the declarant to be unavailable (FRE 804)
Dying declaration: homicide prosecution or civil case; the declarant believed death was imminent; the statement concerns the cause or circumstances of death.
Shepard v. United States (1933): Mrs. Shepard's statement "Dr. Shepard has poisoned me" was not a dying declaration because she did not speak with a settled, hopeless expectation of death.
Statement against interest: Williamson v. United States (1994): only the individual self-inculpatory statements qualify, not collateral statements in a broader narrative.

5. Confrontation Clause
Crawford v. Washington (2004): testimonial statements of a witness absent from trial are admissible against a criminal defendant only if the witness is unavailable and the defendant had a prior opportunity for cross-examination.`;

  if (s.includes("charact") || s.includes("propens") || s.includes("404")) return "character";
  if (s.includes("lead")) return "leading";
  if (s.includes("specul") || s.includes("knowledge") || s.includes("602") || s.includes("foundation")) return "speculation";

}

/* ---------- mastery & weighting ---------- */
function recordMastery(topic, frac) {
  if (!topic) return;
  const m = S.mastery[topic] || { c: 0, t: 0 };
  m.c += frac; m.t += 1; S.mastery[topic] = m;
}
const masteryPct = k => { const m = S.mastery[k]; return m && m.t ? m.c / m.t : null; };
function weakestTopics() {
  const tried = TOPIC_KEYS.filter(k => masteryPct(k) !== null).sort((a, b) => masteryPct(a) - masteryPct(b));
  const untried = TOPIC_KEYS.filter(k => masteryPct(k) === null);
  return tried.concat(untried).slice(0, 2);
}
const triedWeakest = () => TOPIC_KEYS.filter(k => masteryPct(k) !== null).sort((a, b) => masteryPct(a) - masteryPct(b)).slice(0, 2);

  while (out.length < n && rest.length) {
    const ws = rest.map(it => topicWeight(it.topic) * (it.played ? 1 : 3));
    let r = Math.random() * ws.reduce((a, b) => a + b, 0), i = 0;
    for (; i < ws.length - 1; i++) { r -= ws[i]; if (r <= 0) break; }

}
const streakMult = s => Math.min(4, 1 + Math.floor(s / 3));

      else if (kind === "bad") { T(200, .12, "sawtooth", 0, .06); T(140, .25, "sawtooth", .1, .06); }

      else if (kind === "gavel") { T(110, .08, "triangle", 0, .2); T(90, .12, "triangle", .1, .2); }
      else if (kind === "high") { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => T(f, .14, "square", i * .11)); }
      else if (kind === "over") { [392, 330, 262].forEach((f, i) => T(f, .2, "triangle", i * .18, .07)); }

/* Strip fences, find the outermost JSON object, salvage cut-off arrays. */
function extractJSON(raw) {
  let t = String(raw || "").replace(/<think>[\s\S]*?<\/think>/gi, "");
  const fence = t.match(/```(?:json)?\s*([\s\S]*?)(?:```|$)/i);
  if (fence && fence[1].includes("{")) t = fence[1];
  const ob = t.indexOf("{"), ab = t.indexOf("[");
  const start = ab >= 0 && (ob < 0 || ab < ob) ? ab : ob;
  if (start < 0) throw new AppError("PARSE", "The model didn't return any JSON. Try again, or pick another model in Advanced settings.");
  const stack = []; let inStr = false, esc = false, safeEnd = -1, safeStack = null;
  for (let i = start; i < t.length; i++) {
    const ch = t[i];
    if (inStr) { if (esc) esc = false; else if (ch === "\\") esc = true; else if (ch === '"') inStr = false; continue; }
    if (ch === '"') { inStr = true; continue; }
    if (ch === "{" || ch === "[") { stack.push(ch); continue; }
    if (ch === "}" || ch === "]") {
      stack.pop();
      if (!stack.length) return wrapArr(tryParse(t.slice(start, i + 1)));
      if (stack.length <= 2 && stack[stack.length - 1] === "[") { safeEnd = i; safeStack = stack.slice(); }
    }
  }
  if (safeEnd > 0) {   // response was cut off: keep the complete items
    let s = t.slice(start, safeEnd + 1);
    for (let k = safeStack.length - 1; k >= 0; k--) s += safeStack[k] === "{" ? "}" : "]";
    return wrapArr(tryParse(s));
  }
  throw new AppError("PARSE", "The model's answer was cut off before it finished. Try again.");
}
const wrapArr = v => Array.isArray(v) ? { items: v, rounds: v } : v;
function tryParse(s) {
  try { return JSON.parse(s); } catch (e) {
    try { return JSON.parse(s.replace(/,\s*([}\]])/g, "$1")); }
    catch (e2) { throw new AppError("PARSE", "The model's JSON was malformed. Try again, or pick another model in Advanced settings."); }
  }
}

/* ---------- prompts ---------- */
const SYS = "You are an expert Evidence law professor who writes study questions on the U.S. Federal Rules of Evidence (FRE) for law students. You are precise about the rules and never invent rule numbers or case holdings. You reply with ONLY one valid JSON object: no markdown, no code fences, no commentary before or after it.";

  const nl = n.indexOf("\n", start);

const GEN = {

{"items":[{"topic":"hearsayExc","rule":"Dying declaration (FRE 804(b)(2))","facts":"...","elements":[{"text":"Declarant is unavailable","met":true,"why":"One short sentence."}],"outcome":"admissible","explanation":"One or two sentences.","source":"verbatim quote","sourceType":"rules"}]}

/* ---------- validation (discard malformed items) ---------- */
const srcType = v => String(v || "").toLowerCase().startsWith("note") ? "notes" : "rules";
const truthy = v => v === true || /^(true|yes|met|y)$/i.test(String(v).trim());
const VALIDATE = {
  rapid(obj) {
    return arr(obj.items || obj.questions).map(it => {
      const choices = arr(it.choices || it.options).map(c => clean(c, 200)).filter(Boolean);
      let ans = Number(it.answer);
      if (typeof it.answer === "string" && /^\s*[A-Da-d]\s*$/.test(it.answer)) ans = it.answer.trim().toUpperCase().charCodeAt(0) - 65;
      else if (typeof it.answer === "string" && !/^\s*\d+\s*$/.test(it.answer)) ans = choices.findIndex(c => c.toLowerCase() === it.answer.trim().toLowerCase());
      const q = clean(it.question);
      if (!q || choices.length !== 4 || !(ans >= 0 && ans < 4)) return null;
      if (new Set(choices.map(c => c.toLowerCase())).size !== 4) return null;
      const topic = normTopic(it.topic, q + " " + (it.source || ""));
      if (!topic) return null;
      return { type: "rapid", topic, question: q, choices, answer: ans, explanation: clean(it.explanation), source: clean(it.source, 500), sourceType: srcType(it.sourceType) };
    }).filter(Boolean);
  },
  element(obj) {
    return arr(obj.items || obj.problems).map(it => {
      const elements = arr(it.elements).map(e => ({ text: clean(e && e.text, 220), met: truthy(e && e.met), why: clean(e && e.why, 300) })).filter(e => e.text);
      const facts = clean(it.facts, 900), rule = clean(it.rule, 140);
      if (!facts || !rule || elements.length < 2 || elements.length > 6) return null;
      const topic = normTopic(it.topic, rule + " " + (it.source || ""));
      if (!topic) return null;
      const outcome = elements.every(e => e.met) ? "admissible" : "inadmissible"; // keep outcome consistent with elements
      return { type: "element", topic, rule, facts, elements, outcome, explanation: clean(it.explanation), source: clean(it.source, 500), sourceType: srcType(it.sourceType) };
    }).filter(Boolean);
  },
  objection(obj) {
    return arr(obj.rounds || obj.transcripts).map(r => {
      const lines = arr(r && r.lines).map(l => {
        const text = clean(l && l.text, 500); if (!text) return null;
        const sp = String(l.speaker || "").toLowerCase();
        const speaker = sp.startsWith("q") || /attorney|counsel|lawyer|prosecutor/.test(sp) ? "Q" : "A";
        const sustained = /sustain/i.test(String(l.ruling || ""));
        let ground = normGround(l.ground);
        if (sustained && (!ground || ground === "none")) return null;
        if (!sustained) ground = "none";
        const topic = normTopic(l.topic, (l.reason || "") + " " + (l.source || "")) || (sustained ? GROUNDS.find(g => g.k === ground).topic : "relevance");
        return { speaker, text, ruling: sustained ? "sustained" : "overruled", ground, topic, reason: clean(l.reason), source: clean(l.source, 500), sourceType: srcType(l.sourceType) };
      }).filter(Boolean);
      if (lines.length < 6) return null;
      return { title: clean(r.title, 80) || "Mock Trial", setup: clean(r.setup, 400), lines };
    }).filter(Boolean);
  },
  match(obj) {
    const seenL = new Set(), seenR = new Set();
    return arr(obj.items || obj.pairs).map(it => {
      const left = clean(it.left, 70), right = clean(it.right, 170);
      if (!left || !right) return null;
      const kl = left.toLowerCase(), kr = right.toLowerCase();
      if (seenL.has(kl) || seenR.has(kr)) return null;
      const topic = normTopic(it.topic, left + " " + right + " " + (it.source || ""));
      if (!topic) return null;
      seenL.add(kl); seenR.add(kr);
      return { type: "match", kind: it.kind === "case" ? "case" : "rule", topic, left, right, source: clean(it.source, 500), sourceType: srcType(it.sourceType) };
    }).filter(Boolean);
  }
};

async function generate(game, { focus = null, append = false, signal } = {}) {
  const g = GEN[game];
  const n = focus ? g.focusN : g.n;
  const user = contextBlock() + g.prompt(n) + sourceRules(game === "objection" ? null : focus);
  const { content, model } = await callAI([{ role: "system", content: SYS }, { role: "user", content: user }], signal);
  let items = VALIDATE[game](extractJSON(content));
  if (focus && game !== "objection") {
    const focused = items.filter(it => focus.includes(it.topic));
    if (focused.length) items = focused;
  }
  if (!items.length) throw new AppError("PARSE", "The model's answer didn't contain any usable questions. Try again, or pick another model in Advanced settings.");
  items.forEach(it => { it.id = uid(); it.played = false; });
  S.packs[game] = append ? S.packs[game].concat(items) : items;
  S.packMeta[game] = { hash: notesHash(), model, at: Date.now() };
  save();
  return items;
}

async function readPdf(file, onProgress) {
  if (!window.pdfjsLib) throw new Error("The PDF reader didn't load. Check your connection, or paste the text instead.");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const out = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    onProgress && onProgress(p, pdf.numPages);
    const tc = await (await pdf.getPage(p)).getTextContent();
    out.push(tc.items.map(i => i.str + (i.hasEOL ? "\n" : " ")).join(""));
  }
  return out.join("\n\n");
}

    const submit = el("button", { class: "btn solid", disabled: true, onclick: grade }, "SUBMIT");
    const fbWrap = el("div");
    function pickOutcome(o) { if (done) return; outcome = o; ocBtns.forEach((b, i) => b.classList.toggle("on", ["admissible", "inadmissible"][i] === o)); submit.disabled = false; Sound.play("click"); }
    screen(hudBar(st, title),
      el("div", { class: "card" }, el("span", { class: "topic-chip" }, TOPIC_BY_KEY[it.topic].label),
        el("div", { class: "rule-name" }, it.rule),
        el("div", { class: "facts" }, it.facts),
        el("div", { class: "small muted", style: "margin-bottom:8px" }, "Tap each element the facts SATISFY:"),
        el("div", { class: "els" }, elBtns),
        el("div", { class: "small muted", style: "margin-bottom:8px" }, "Outcome under this rule:"),
        el("div", { class: "outcomes" }, ocBtns),
        el("div", { class: "next-row" }, submit), fbWrap));
    inGame = true;
    keyHandler = e => { const k = e.key.toLowerCase(); if (k === "a") pickOutcome("admissible"); else if (k === "i") pickOutcome("inadmissible"); else if (k === "enter" && outcome && !done) grade(); else { const n = parseInt(k, 10); if (n >= 1 && n <= elBtns.length) elBtns[n - 1].click(); } };
    function grade() {
      if (done || !outcome) return; done = true; submit.remove();
      let right = 0;
      it.elements.forEach((e, idx) => {
        const ok = checked[idx] === e.met; if (ok) right++;
        const b = elBtns[idx]; b.disabled = true; b.classList.add(ok ? "right" : "wrong");
        b.children[1].append(el("span", { class: "why" }, `${ok ? "✓" : "✗"} ${e.met ? "Met" : "Not met"}${e.why ? ". " + e.why : ""}`));
      });
      const ocOk = outcome === it.outcome;
      ocBtns.forEach((b, i) => { b.disabled = true; const o = ["admissible", "inadmissible"][i]; if (o === it.outcome) b.style.borderColor = "var(--green)"; else if (o === outcome) b.style.borderColor = "var(--red)"; });
      const parts = it.elements.length + 1, got = right + (ocOk ? 1 : 0), perfect = got === parts;
      let pts = right * 50 + (ocOk ? 100 : 0);
      if (perfect) { st.streak++; st.bestStreak = Math.max(st.bestStreak, st.streak); pts = Math.round(pts * streakMult(st.streak)); Sound.play("good"); }
      else { st.streak = 0; Sound.play("bad"); }
      st.score += pts; st.got += got; st.parts += parts; it.played = true;
      recordMastery(it.topic, got / parts); addTopic(st, it.topic, got / parts);
      if (!perfect) st.missed.push({ game: title, topic: it.topic, prompt: `${it.rule}: ${it.facts}`,
        yours: `Checked: ${it.elements.filter((e, i) => checked[i]).map(e => e.text).join("; ") || "(none)"}. Outcome: ${outcome}.`,
        correct: `Met: ${it.elements.filter(e => e.met).map(e => e.text).join("; ") || "(none)"}. Outcome: ${it.outcome}.`,
        why: it.explanation, source: it.source, srcLabel: srcLabelText(it) });
      const nextBtn = el("button", { class: "btn solid", onclick: advance }, "NEXT ▶");
      fbWrap.replaceChildren(el("div", { class: "fb " + (perfect ? "good" : "bad") },
        el("div", { class: "verdict" }, perfect ? "PERFECT!" : `${got}/${parts} RIGHT`, el("span", { class: "pts" }, `+${fmt(pts)}`)),
        el("div", { style: "margin-bottom:6px" }, "Correct outcome: ", el("b", {}, it.outcome.toUpperCase()), ocOk ? " ✓" : " (you said " + outcome + ")"),
        it.explanation ? el("div", {}, it.explanation) : null, sourceBox(it), el("div", { class: "next-row" }, nextBtn)));
      app.firstChild.replaceWith(hudBar(st, title));
      nextBtn.focus({ preventScroll: true }); fbWrap.scrollIntoView({ behavior: "smooth", block: "nearest" });
      keyHandler = e => { if (e.key === "Enter") { e.preventDefault(); advance(); } };
    }
  }
}

/* =====================================================================
   OBJECTION!
   ===================================================================== */
function startObjection(round) {
  const st = { i: 0, score: 0, streak: 0, bestStreak: 0, got: 0, total: 0, topics: {}, missed: [], items: round.lines };
  const log = el("div", { class: "transcript", "aria-live": "polite" });
  const ctrl = el("div", { class: "ctrl" });
  const hudWrap = el("div");
  const refreshHud = () => hudWrap.replaceChildren(el("div", { class: "ghud" },
    el("span", { class: "gt" }, "OBJECTION!"), el("span", {}, `LINE ${Math.min(st.i + 1, round.lines.length)}/${round.lines.length}`),
    el("span", { class: "sc" }, `SCORE ${fmt(st.score)}`), el("span", { class: "streak" }, st.streak >= 3 ? `🔥 x${streakMult(st.streak)}` : `STREAK ${st.streak}`),
    el("span", { class: "spacer" }), el("button", { class: "btn small ghost", onclick: quitConfirm }, "Quit")));
  refreshHud();
  screen(hudWrap,
    el("div", { class: "card" }, el("div", { class: "rule-name" }, round.title), round.setup ? el("div", { class: "setup" }, round.setup) : null, log),
    ctrl);
  inGame = true;
  showLine();

  function showLine() {
    if (st.i >= round.lines.length) return finish();
    const line = round.lines[st.i];
    log.querySelectorAll(".cur").forEach(n => n.classList.remove("cur"));
    const mk = el("span", { class: "mk" });
    const row = el("div", { class: "tl cur" }, el("span", { class: "sp" }, line.speaker + "."), el("span", {}, line.text), mk);
    log.append(row);
    const t0 = performance.now();
    refreshHud(); mainControls();
    setTimeout(() => row.scrollIntoView({ behavior: "smooth", block: "center" }), 30);

    function mainControls() {
      ctrl.replaceChildren(el("div", { class: "big" },
        el("button", { class: "obj-btn in", onclick: () => decide("none") }, "LET IT IN", el("div", { style: "font-size:9px;margin-top:6px;opacity:.7" }, "OVERRULED · L")),
        el("button", { class: "obj-btn obj", onclick: groundControls }, "OBJECTION!", el("div", { style: "font-size:9px;margin-top:6px;opacity:.8" }, "PICK GROUND · O"))));
      keyHandler = e => { const k = e.key.toLowerCase(); if (k === "l") decide("none"); else if (k === "o") groundControls(); };
    }
    function groundControls() {
      Sound.play("gavel");
      ctrl.replaceChildren(el("div", { class: "row", style: "justify-content:space-between;margin-bottom:8px" },
          el("span", { class: "pixel", style: "font-size:11px;color:var(--red)" }, "GROUNDS?"),
          el("button", { class: "btn small ghost", onclick: mainControls }, "← Back")),
        el("div", { class: "grounds" }, GROUNDS.map((g, i) => el("button", { class: "ground", onclick: () => decide(g.k) }, el("span", { class: "k" }, i + 1), g.label))));
      keyHandler = e => { const n = parseInt(e.key, 10); if (n >= 1 && n <= 6) decide(GROUNDS[n - 1].k); else if (e.key === "Escape") mainControls(); };
    }
    function decide(choice) {
      keyHandler = null;
      const secs = (performance.now() - t0) / 1000;
      const ok = line.ruling === "overruled" ? choice === "none" : choice === line.ground;
      let pts = 0;
      if (ok) { st.streak++; st.bestStreak = Math.max(st.bestStreak, st.streak); pts = Math.round((100 + Math.max(0, 50 - secs * 5)) * streakMult(st.streak)); st.score += pts; st.got++; Sound.play("good"); }
      else { st.streak = 0; Sound.play("bad"); ctrl.classList.add("shake"); setTimeout(() => ctrl.classList.remove("shake"), 450); }
      st.total++; recordMastery(line.topic, ok ? 1 : 0); addTopic(st, line.topic, ok ? 1 : 0);
      row.classList.remove("cur"); row.classList.add(ok ? "ok" : "no"); mk.textContent = ok ? "✓" : "✗";
      const rulingText = line.ruling === "sustained" ? `SUSTAINED · ${groundLabel(line.ground)}` : "OVERRULED · it comes in";
      const yours = choice === "none" ? "Let it in" : `Objection: ${groundLabel(choice)}`;
      let note = null;
      if (!ok && line.ruling === "sustained" && choice !== "none") note = "Right to object, wrong ground.";
      if (!ok && line.ruling === "sustained" && choice === "none") note = "This one should have drawn an objection.";
      if (!ok && line.ruling === "overruled") note = "No winning objection here.";
      if (!ok) st.missed.push({ game: "Objection!", topic: line.topic, prompt: `${round.title}: ${line.speaker === "Q" ? "Question" : "Answer"}: "${line.text}"`, yours, correct: rulingText, why: line.reason, source: line.source, srcLabel: srcLabelText(line) });
      st.i++; refreshHud();
      const last = st.i >= round.lines.length;
      const nextBtn = el("button", { class: "btn solid", onclick: showLine }, last ? "VERDICT ▶" : "NEXT LINE ▶");
      ctrl.replaceChildren(el("div", { class: "fb " + (ok ? "good" : "bad"), style: "margin-top:0" },
        el("div", { class: "verdict" }, ok ? "GOOD CALL!" : "BAD CALL!", ok ? el("span", { class: "pts" }, `+${fmt(pts)}`) : null),
        el("div", {}, "Ruling: ", el("b", {}, rulingText)),
        el("div", { class: "small muted" }, "You: " + yours + (note ? ". " + note : "")),
        line.reason ? el("div", { style: "margin-top:6px" }, line.reason) : null,
        sourceBox(line), el("div", { class: "next-row" }, nextBtn)));
      nextBtn.focus({ preventScroll: true });
      keyHandler = e => { if (e.key === "Enter") { e.preventDefault(); showLine(); } };
    }
  }
  function finish() {
    round.played = true; save();
    showResults({ game: "objection", score: st.score, correct: st.got, total: st.total, bestStreak: st.bestStreak, topics: st.topics, missed: st.missed, headline: "COURT ADJOURNED", extra: [] });
  }
}

/* =====================================================================
   MATCH
   ===================================================================== */
function bankPairs() {
  return ALL_RULES.filter(r => !/common law/.test(r.n)).map(r => ({ id: "bank-" + r.n, type: "match", kind: "rule", topic: r.topic, left: "FRE " + r.n, right: r.name.charAt(0).toUpperCase() + r.name.slice(1), source: r.t, sourceType: "rules", played: false }));
}
function pickMatchPairs() {
  const same = (a, b) => a.left.toLowerCase() === b.left.toLowerCase() || a.right.toLowerCase() === b.right.toLowerCase();
  let picks = pickWeighted(S.packs.match, 6, same);
  if (picks.length < 6) picks = picks.concat(pickWeighted(bankPairs().filter(b => !picks.some(p => same(p, b))), 6 - picks.length, same));
  return picks;
}
function startMatch(pairs) {
  const st = { mistakes: 0, matched: 0, t0: performance.now(), missedIds: new Set(), sel: null };
  const timeEl = el("span", { class: "sc" }, "TIME 0:00"), misEl = el("span", { class: "streak" }, "MISTAKES 0");
  const hud = el("div", { class: "ghud" }, el("span", { class: "gt" }, "MATCH"), timeEl, misEl, el("span", {}, `PAIRS 0/${pairs.length}`), el("span", { class: "spacer" }), el("button", { class: "btn small ghost", onclick: quitConfirm }, "Quit"));
  const mk = (p, side) => {
    const b = el("button", { class: "mi " + (side === "L" ? "l" : "r") }, side === "L" ? p.left : p.right);
    b.dataset.id = p.id; b.dataset.side = side; b.addEventListener("click", () => tap(b)); return b;
  };
  const L = shuffle(pairs).map(p => mk(p, "L")), R = shuffle(pairs).map(p => mk(p, "R"));
  screen(hud, el("p", { class: "small muted", style: "margin-top:0" }, "Click a label on the left, then its match on the right."),
    el("div", { class: "mgrid" }, el("div", { class: "mcol" }, L), el("div", { class: "mcol" }, R)));
  inGame = true;
  const iv = setInterval(() => timeEl.textContent = "TIME " + fmtTime((performance.now() - st.t0) / 1000), 250);
  cleanup.push(() => clearInterval(iv));
  function tap(b) {
    if (b.classList.contains("done")) return;
    if (!st.sel || st.sel.dataset.side === b.dataset.side) {
      if (st.sel) st.sel.classList.remove("sel");
      if (st.sel === b) { st.sel = null; return; }
      st.sel = b; b.classList.add("sel"); Sound.play("click"); return;
    }
    const a = st.sel; st.sel = null; a.classList.remove("sel");
    if (a.dataset.id === b.dataset.id) {
      a.classList.add("done"); b.classList.add("done"); st.matched++; Sound.play("good");
      hud.children[3].textContent = `PAIRS ${st.matched}/${pairs.length}`;
      if (st.matched === pairs.length) { clearInterval(iv); setTimeout(finish, 450); }
    } else {
      st.mistakes++; misEl.textContent = `MISTAKES ${st.mistakes}`; Sound.play("bad");
      st.missedIds.add(a.dataset.id); st.missedIds.add(b.dataset.id);
      [a, b].forEach(x => { x.classList.add("shake", "flash-bad"); setTimeout(() => x.classList.remove("shake", "flash-bad"), 450); });
    }
  }
  function finish() {
    const secs = (performance.now() - st.t0) / 1000;
    const score = Math.max(0, Math.round(pairs.length * 100 + Math.max(0, 300 - secs * 5) - st.mistakes * 30));
    const topics = {}, missed = [];
    pairs.forEach(p => {
      const ok = !st.missedIds.has(p.id);
      const t = topics[p.topic] || { c: 0, t: 0 }; t.c += ok ? 1 : 0; t.t++; topics[p.topic] = t;
      recordMastery(p.topic, ok ? 1 : 0);
      const real = S.packs.match.find(x => x.id === p.id); if (real) real.played = true;
      if (!ok) missed.push({ game: "Match", topic: p.topic, prompt: p.left, yours: "(mismatched at least once)", correct: p.right, why: "", source: p.source, srcLabel: srcLabelText(p) });
    });
    const newBest = !S.bestTime || secs < S.bestTime;
    if (newBest) S.bestTime = Math.round(secs);
    save();
    showResults({ game: "match", score, correct: pairs.length - missed.length, total: pairs.length, bestStreak: null, topics, missed, headline: "ALL MATCHED",
      extra: [["Time", fmtTime(secs) + (newBest ? " ★ BEST" : "")], ["Mistakes", String(st.mistakes)]] });
  }
}

/* =====================================================================
   RESULTS
   ===================================================================== */
function showResults(r) {
  const prevHigh = S.highs[r.game] || 0;
  const isHigh = r.score > 0 && r.score > prevHigh;
  if (isHigh) S.highs[r.game] = r.score;
  S.coins = (S.coins || 0) + r.score;
  const stamp = new Date().toISOString();
  S.missed = r.missed.map(m => ({ ...m, at: stamp })).concat(S.missed).slice(0, 300);
  save(); updateCoins();

  const scoreEl = el("div", { class: "big-score" }, "0");
  const acc = r.total ? Math.round(r.correct / r.total * 100) : 0;
  const stats = [["Accuracy", acc + "%"]].concat(r.bestStreak !== null ? [["Best streak", String(r.bestStreak)]] : [], r.extra || [], [["High score", fmt(Math.max(prevHigh, r.score))]]);
  const topicRows = Object.entries(r.topics).sort((a, b) => a[1].c / a[1].t - b[1].c / b[1].t).map(([k, v]) => {
    const p = v.c / v.t;
    return el("div", { class: "mbar" + (p < 0.6 ? " weak" : "") }, el("div", { style: "font-weight:600" }, TOPIC_BY_KEY[k].label),
      el("div", { class: "track" }, el("div", { class: "fill", style: `width:${Math.round(p * 100)}%` })), el("div", { class: "pct" }, Math.round(p * 100) + "%"));
  });
  const missList = r.missed.map(m => el("div", { class: "miss" },
    el("span", { class: "topic-chip" }, TOPIC_BY_KEY[m.topic] ? TOPIC_BY_KEY[m.topic].label : m.topic),
    el("div", { class: "mq" }, m.prompt),
    el("div", { class: "ma" }, el("i", {}, "You: " + m.yours)),
    el("div", { class: "ma" }, el("b", {}, "Correct: " + m.correct)),
    m.why ? el("div", { class: "small muted", style: "margin-top:4px" }, m.why) : null,
    sourceBox(m)));
  const replayGame = r.game;
  screen(
    el("div", { class: "h1", style: "text-align:center" }, r.headline),
    scoreEl,
    isHigh ? el("div", { class: "newhigh" }, "★ NEW HIGH SCORE ★") : null,
    el("div", { class: "stats" }, stats.map(([l, v]) => el("div", { class: "stat" }, el("div", { class: "l" }, l), el("div", { class: "v" }, v)))),
    topicRows.length ? el("div", { class: "card" }, el("div", { class: "h2" }, "THIS ROUND BY TOPIC"), topicRows) : null,
    el("div", { class: "card" }, el("div", { class: "h2" }, r.missed.length ? `MISSED (${r.missed.length})` : "NO MISSES!"),
      r.missed.length ? missList : el("p", { class: "muted", style: "margin:0" }, "Flawless round. Nothing to review."),
      r.missed.length ? el("div", { class: "row", style: "margin-top:12px" }, el("button", { class: "btn small", onclick: () => downloadMissed(r.missed.map(m => ({ ...m, at: stamp })), `study-arcade-${replayGame}-misses.txt`) }, "⬇ Download these misses (.txt)")) : null),
    el("div", { class: "row" },
      el("button", { class: "btn solid", onclick: () => { Sound.play("coin"); replayGame === "weak" ? showWeakIntro() : startGame(replayGame); } }, "▶ PLAY AGAIN"),
      el("button", { class: "btn", onclick: () => freshQuestions(replayGame) }, "↻ Fresh questions"),
      el("button", { class: "btn ghost", onclick: showHub }, "Back to hub")));
  // count-up animation
  const t0 = performance.now(), dur = 900;
  const tick = () => { const p = Math.min(1, (performance.now() - t0) / dur); scoreEl.textContent = fmt(r.score * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  if (isHigh) { Sound.play("high"); confetti(); } else Sound.play(acc >= 60 ? "coin" : "over");
}

function downloadMissed(list, filename) {
  if (!list.length) return;
  const lines = ["STUDY ARCADE: EVIDENCE EDITION · REVIEW SHEET", `Generated ${new Date().toLocaleString()}`, `${list.length} missed item${list.length === 1 ? "" : "s"}`,
    "AI-generated questions can be wrong. Check against the rules and your notes.", ""];
  list.forEach((m, i) => {
    lines.push(`${i + 1}. [${TOPIC_BY_KEY[m.topic] ? TOPIC_BY_KEY[m.topic].label : m.topic}] ${m.game}`);
    lines.push(`   Q: ${m.prompt}`, `   Your answer: ${m.yours}`, `   Correct: ${m.correct}`);
    if (m.why) lines.push(`   Why: ${m.why}`);
    if (m.source) lines.push(`   Source (${m.srcLabel || "unchecked"}): "${m.source}"`);
    lines.push("");
  });
  const blob = new Blob([lines.join("\n")], { type: "text/plain" });
  const a = el("a", { href: URL.createObjectURL(blob), download: filename });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* =====================================================================
   BOOT
   ===================================================================== */
document.getElementById("muteBtn").addEventListener("click", () => { S.settings.muted = !S.settings.muted; save(); updateMute(); Sound.play("click"); });
document.getElementById("logoBtn").addEventListener("click", () => {
  if (inGame) quitConfirm(); else if (S.notes || Object.values(S.packs).some(p => p.length)) showHub(); else showSetup();
});
updateCoins(); updateMute();
showSetup();
</script>
